[package]
name = "strata"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust-powered static HTML fragments for React Server Components"
repository = "https://github.com/farming-labs/strata"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.8.2"
napi = { version = "3.12.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"

[build-dependencies]
napi-build = "2.4.0"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[lints.clippy]
all = { level = "warn", priority = -1 }
